[project]
name = "av-tech-trends-patent-mining"
version = "0.1.0"
description = "A data-driven analysis of autonomous vehicle patents using NLP and ML techniques."
authors = [
    { name = "Aniket Shinde" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "nltk>=3.8.1",
    "spacy>=3.7.0",
    "sentence-transformers>=2.3.0",
    "tensorflow>=2.15.0",
    "prophet>=1.1.5",
    "plotly>=5.18.0",
    "umap-learn>=0.5.5",
    "wordcloud>=1.9.3",
    "requests>=2.31.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.1",
]
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
